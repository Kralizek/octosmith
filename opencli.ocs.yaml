opencliVersion: "1.0.0-alpha.14"

info:
  title: Octosmith
  summary: Declaratively manage GitHub resources.
  version: "0.1.0"
  binary: octosmith

global:
  flags:
    - name: help
      type: boolean
      summary: Show help.
    - name: version
      type: boolean
      summary: Print the Octosmith CLI version.

commands:
  octosmith plan:
    kind: action
    summary: Show required changes.
    args:
      - name: resource
        type: string
        required: false
        summary: Primary resource target.
    flags:
      - name: path
        aliases: [p]
        type: string
        default: "."
        summary: Configuration directory.
      - name: format
        type: string
        default: text
        choices:
          - value: text
          - value: json
        summary: Output format.
      - name: verbose
        aliases: [v]
        type: boolean
        summary: Show additional result details.
      - name: trace
        type: boolean
        summary: Emit GitHub API request traces to stderr.
      - name: events-output
        type: string
        summary: Write Hooksmith resource events as NDJSON.
      - name: out
        type: string
        summary: Write the persisted plan artifact.

  octosmith apply:
    kind: action
    summary: Apply required changes.
    args:
      - name: resource
        type: string
        required: false
        summary: Primary resource target.
    flags:
      - name: path
        aliases: [p]
        type: string
        default: "."
        summary: Configuration directory.
      - name: format
        type: string
        default: text
        choices:
          - value: text
          - value: json
        summary: Output format.
      - name: verbose
        aliases: [v]
        type: boolean
        summary: Show additional result details.
      - name: trace
        type: boolean
        summary: Emit GitHub API request traces to stderr.
      - name: events-output
        type: string
        summary: Write Hooksmith resource events as NDJSON.
      - name: plan
        type: string
        summary: Apply a persisted plan artifact.

  octosmith resource:
    kind: group
    summary: Resource operations.

  octosmith resource list:
    kind: action
    summary: List resources within configured scope.
    flags:
      - name: path
        aliases: [p]
        type: string
        default: "."
        summary: Configuration directory.
      - name: format
        type: string
        default: text
        choices:
          - value: text
          - value: json
        summary: Output format.

  octosmith resource create:
    kind: action
    summary: Create a resource from a template.
    args:
      - name: template
        type: string
        required: true
        summary: Template to instantiate.
    flags:
      - name: name
        type: string
        summary: Name for the new resource.
      - name: path
        aliases: [p]
        type: string
        default: "."
        summary: Configuration directory.
      - name: format
        type: string
        default: text
        choices:
          - value: text
          - value: json
        summary: Output format.

  octosmith template:
    kind: group
    summary: Template operations.

  octosmith template validate:
    kind: action
    summary: Validate configuration and templates without accessing GitHub.
    args:
      - name: template
        type: string
        required: false
        summary: Template target.
    flags:
      - name: path
        aliases: [p]
        type: string
        default: "."
        summary: Configuration directory.
      - name: format
        type: string
        default: text
        choices:
          - value: text
          - value: json
        summary: Output format.

  octosmith template permissions:
    kind: action
    summary: Analyze worst-case permissions for a template or configuration.
    args:
      - name: template
        type: string
        required: false
        summary: Template target.
    flags:
      - name: path
        aliases: [p]
        type: string
        default: "."
        summary: Configuration directory.
      - name: format
        type: string
        default: text
        choices:
          - value: text
          - value: json
        summary: Output format.
