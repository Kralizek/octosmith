name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            opencli-archive: ocli_Linux_x86_64.tar.gz
            opencli-sha256: e00cfd15ac4af3a925fbc711140b94efda8ae9a5a15993e17f2f5cac7923db48
          - os: windows-latest
            opencli-archive: ocli_Windows_x86_64.zip
            opencli-sha256: 3d25dcb37823971e1b3e96592eff30a05fc45915089cd27f31c9f7eac11f80fb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install OpenCLI
        env:
          OPENCLI_ARCHIVE: ${{ matrix.opencli-archive }}
          OPENCLI_SHA256: ${{ matrix.opencli-sha256 }}
        run: |
          archive="$RUNNER_TEMP/$OPENCLI_ARCHIVE"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/bcdxn/opencli/releases/download/v1.3.0/$OPENCLI_ARCHIVE"
          echo "$OPENCLI_SHA256  $archive" \
            | sha256sum --check --status
          if [[ "$OPENCLI_ARCHIVE" == *.zip ]]; then
            unzip -o "$archive" ocli.exe -d "$RUNNER_TEMP"
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP" ocli
            chmod +x "$RUNNER_TEMP/ocli"
          fi
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate OpenCLI contract
        run: ocli check opencli.ocs.yaml

      - name: Check
        run: deno task check

      - name: Prepare Action smoke-test configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/octosmith-action-smoke/templates"
          cat > "$RUNNER_TEMP/octosmith-action-smoke/octosmith.yml" <<'YAML'
          version: 1
          organization: Kralizek
          repositories:
            scope:
              include:
                names:
                  - octosmith
          YAML
          cat > "$RUNNER_TEMP/octosmith-action-smoke/templates/default.yml" <<'YAML'
          version: 1
          kind: repository
          match:
            include:
              names:
                - octosmith
          repository: {}
          YAML

      # The PR token is an installation token, not a personal-account token.
      # Keep the Action smoke test offline; live GitHub E2E uses dedicated credentials.
      - name: Smoke test local Action
        uses: ./
        env:
          OCTOSMITH_CLI_ENTRYPOINT: ${{ github.workspace }}/packages/cli/mod.ts
        with:
          mode: validate
          path: ${{ runner.temp }}/octosmith-action-smoke
          format: json

      - name: Validate packages
        run: deno publish --dry-run
