name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install OpenCLI
        run: go install github.com/bcdxn/opencli/cmd/ocli@v1.3.0

      - name: Validate OpenCLI contract
        run: ocli check opencli.ocs.yaml

      - name: Check
        run: deno task check

      - name: Prepare Action smoke-test configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/octosmith-action-smoke/templates"
          cat > "$RUNNER_TEMP/octosmith-action-smoke/octosmith.yml" <<'YAML'
          version: 1
          organization: Kralizek
          repositories:
            scope:
              names:
                - octosmith
          YAML
          cat > "$RUNNER_TEMP/octosmith-action-smoke/templates/default.yml" <<'YAML'
          version: 1
          kind: repository
          match:
            names:
              - octosmith
          repository: {}
          YAML

      - name: Smoke test local Action
        uses: ./
        env:
          OCTOSMITH_CLI_ENTRYPOINT: ${{ github.workspace }}/packages/cli/mod.ts
        with:
          mode: plan
          path: ${{ runner.temp }}/octosmith-action-smoke
          github-token: ${{ github.token }}
          repository: octosmith
          format: json

      - name: Validate packages
        run: deno publish --dry-run
