version: 1
kind: repository
match:
  include:
    names: [team-*-svcs]
includes: [../fragments/base.yml]
repository:
  post_create_commands:
    - command: executable-that-must-not-be-probed
      args: [PRIVATE_COMMAND_ARGUMENT_SENTINEL]
    - command: another-missing-executable
  settings:
    has_issues: false
  files:
    README.md:
      ensure: exact
      source: files/README.txt
    obsolete.txt:
      ensure: absent
