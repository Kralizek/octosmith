name: Octosmith
description: Validate, plan, or apply declarative GitHub configuration with Octosmith

inputs:
  mode:
    description: Octosmith command to run (validate, plan, or apply)
    required: true
  path:
    description: Configuration directory
    required: false
    default: "."
  github-token:
    description: GitHub token used by plan/apply; not required for validate
    required: false
    default: ""
  repository:
    description: Optional resource target
    required: false
    default: ""
  format:
    description: Output format (text or json)
    required: false
    default: text
  verbose:
    description: Include unchanged report items
    required: false
    default: "false"
  events-output:
    description: Optional writable path for NDJSON Hooksmith resource events
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Run Octosmith
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OCTOSMITH_MODE: ${{ inputs.mode }}
        OCTOSMITH_PATH: ${{ inputs.path }}
        OCTOSMITH_REPOSITORY: ${{ inputs.repository }}
        OCTOSMITH_FORMAT: ${{ inputs.format }}
        OCTOSMITH_VERBOSE: ${{ inputs.verbose }}
        OCTOSMITH_EVENTS_OUTPUT: ${{ inputs.events-output }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-action.sh"
