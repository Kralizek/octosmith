# yaml-language-server: $schema=../../../schemas/template.schema.json

version: 1
kind: repository

match:
  include:
    names:
      - "*-infra"
      - "terraform-*"

repository:
  settings:
    has_projects: false
    has_discussions: false
    has_issues: false
    has_wiki: false
    delete_branch_on_merge: true
    merge:
      merge_commit: false
      rebase: false
      squash: true

  teams:
    - name: platform-team
      permission: maintain

  actions:
    variables:
      - INFRASTRUCTURE_REGION

  rulesets:
    - name: protect-default-branch
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
      rules:
        - type: deletion
        - type: non_fast_forward
        - type: pull_request
          parameters:
            required_review_thread_resolution: true
            allowed_merge_methods:
              - squash
