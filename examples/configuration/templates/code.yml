# yaml-language-server: $schema=../../../schemas/template.schema.json

version: 1
kind: repository

match:
  include:
      properties:
        repository-type: code

repository:
  settings:
    has_projects: false
    has_discussions: false
    has_issues: false
    has_wiki: false
    delete_branch_on_merge: true
    merge:
      merge_commit: false
      rebase: false
      squash: true

  teams:
    - name: platform-team
      permission: maintain

  actions:
    secrets:
      - REVIEW_BOT_TOKEN
    variables:
      - NOTIFICATION_CHANNEL_ID

  rulesets:
    - name: protect-default-branch
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
      rules:
        - type: deletion
        - type: non_fast_forward
        - type: pull_request
          parameters:
            required_review_thread_resolution: true
            allowed_merge_methods:
              - squash

  environments:
    - name: automation
      secrets:
        - PACKAGE_FEED_SECRET
      variables:
        - PACKAGE_FEED_CLIENT_ID
        - PACKAGE_FEED_TENANT_ID

  files:
    .github/workflows/request-review.yml:
      ensure: exact
      source: files/workflows/request-review.yml
