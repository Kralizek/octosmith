# yaml-language-server: $schema=../../../schemas/template.schema.json

version: 1
kind: repository

match:
  include:
    properties:
      repository-type: issues

repository:
  settings:
    has_projects: false
    has_discussions: false
    has_issues: true
    has_wiki: false
    delete_branch_on_merge: true

  teams:
    - name: platform-team
      permission: maintain
