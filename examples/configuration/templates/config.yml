# yaml-language-server: $schema=../../../schemas/template.schema.json

version: 1
kind: repository

match:
  include:
    include:
      properties:
        repository-type: config

repository:
  settings:
    has_projects: false
    has_discussions: false
    has_issues: false
    has_wiki: false
    delete_branch_on_merge: true

  teams:
    - name: platform-team
      permission: maintain
    - name: configuration-maintainers
      permission: configuration-editor
