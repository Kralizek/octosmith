# yaml-language-server: $schema=../../schemas/octosmith.schema.json

version: 1

organization: example-org

repositories:
  settings:
    default_branch_drift: ignore
  file_changes:
    mode: pull_request
    pull_request:
      introduction: |
        Repository configuration is centrally managed.
        Please review the changes before merging.
  scope:
    include:
      teams:
        - platform-team
